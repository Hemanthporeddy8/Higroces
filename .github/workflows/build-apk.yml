name: Build Amorelot Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Amorelot-v1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Amorelot-v1.0.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/HiGroces-v1.0.apk
          echo "APK generated successfully at release-output/Amorelot-v1.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amorelot-Full-App-APK
          path: release-output/Amorelot-v1.0.apk
          retention-days: 30

      - name: Publish Direct Public Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "Amorelot Android App v1.0.1"
          body: |
            ## 🚀 Amorelot Native Android App v1.0.1
            
            ### ✨ What's New:
            * 📲 **Hidden In-App Install Prompt:** Resolved install app button appearing inside the installed Android app.
            * 🥩 **New Butcher UI & Instant Digital Scale:** Smooth mobile-responsive cut selection, 1-tap weights (500g, 750g, 1kg, 1.5kg, 2kg) and steppers without annoying scale lag.
            * 🔐 **Secure Sign-In Enforced:** Account login required before confirming orders.
            * 📍 **Persistent Delivery Location:** Saved addresses and GPS coordinates are remembered permanently.
            * 🧹 **Cleaned Customer Drawer:** Removed internal admin link and WhatsApp button.
            
            ### 📲 How to Install:
            1. Tap **`Amorelot-v1.0.apk`** below to download directly to your phone.
            2. Open the downloaded file and tap **Install** (enable "Install unknown apps" if prompted).
            3. Open **Amorelot** from your home screen!
          files: |
            release-output/Amorelot-v1.0.apk
            release-output/Amorelot-v1.0.1.apk
            release-output/HiGroces-v1.0.apk
